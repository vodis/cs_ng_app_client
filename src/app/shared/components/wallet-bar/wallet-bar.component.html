<div class="wallet-bar">
  @if (showTrigger) {
    @if (!account) {
      <button
        (click)="handleOpenWalletMenu()"
        mat-stroked-button
        color="primary"
        class="btn-lg">
        Connect wallet
      </button>
    } @else {
      <app-wallet-menu
        [account]="account"
        (accountClick)="handleOpenWalletMenu()" />
    }
  }

  @if (hostModal) {
    <app-side-modal
      [isOpen]="isOpenWalletConnectMenu"
      [showCloseButton]="showHostCloseButton"
      (closeRequested)="handleCloseWalletMenu()">
      @if (
        isOpenWalletConnectMenu && hasActiveWallet && drawerMode === 'wallet'
      ) {
        <app-connected-wallet-board />
      }
      <div
        class="wallet-bar__mfe-host"
        [class.wallet-bar__mfe-host--hidden]="
          hasActiveWallet && drawerMode === 'wallet'
        ">
        <app-wallets />
      </div>
    </app-side-modal>
  }
</div>
