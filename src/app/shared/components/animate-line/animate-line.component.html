<div
  class="animate-line"
  [class.animate-line--row]="direction === Direction.Row"
  [class.animate-line--column]="direction === Direction.Column"
  [style.--line-size]="size">
  <span
    class="animate-line__stroke"
    [class.animate-line__stroke--row]="direction === Direction.Row"
    [class.animate-line__stroke--column]="direction === Direction.Column"
    [style.animation-duration.s]="duration"
    (animationend)="onAnimationEnd()"></span>
</div>
