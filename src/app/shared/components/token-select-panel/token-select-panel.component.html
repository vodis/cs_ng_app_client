<div class="token-select-panel">
  <header class="token-select-panel__header">
    <h6 class="token-select-panel__title">{{ title }}</h6>
    <button
      type="button"
      class="token-select-panel__close"
      aria-label="Close token selector"
      (click)="handleClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="token-select-panel__body">
    @if (viewModel.state !== 'ready') {
      <p
        class="token-select-panel__status"
        [class.token-select-panel__status--error]="viewModel.isError">
        {{ viewModel.statusMessage }}
      </p>
    } @else {
      <ul
        class="token-select-panel__list"
        role="listbox"
        [attr.aria-label]="title">
        @for (token of availableTokens; track token.assetId) {
          <li role="presentation">
            <button
              type="button"
              class="token-select-panel__item"
              role="option"
              [attr.aria-selected]="token.symbol === selectedSymbol"
              [class.token-select-panel__item--selected]="
                token.symbol === selectedSymbol
              "
              (click)="handleSelect(token)">
              <span
                class="token-select-panel__icon"
                [style.backgroundColor]="token.color">
                @if (token.icon) {
                  <img [src]="token.icon" [alt]="token.symbol" />
                } @else {
                  {{ token.symbol[0] }}
                }
              </span>
              <span class="token-select-panel__meta">
                <strong>{{ token.displaySymbol || token.symbol }}</strong>
                <span>{{ token.name }}</span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>
