<div
  class="side-modal-backdrop"
  [ngClass]="{ open: isOpen }"
  (click)="handleBackdropClick()"></div>

<div
  #dialog
  class="side-modal"
  [ngClass]="{ open: isOpen, 'side-modal--left': placement === 'left' }"
  role="dialog"
  [attr.aria-modal]="isOpen"
  [attr.aria-hidden]="!isOpen"
  [inert]="!isOpen"
  (click)="handleDialogClick($event)">
  <ng-content></ng-content>
</div>
