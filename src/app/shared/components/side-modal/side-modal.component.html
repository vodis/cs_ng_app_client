<div
  class="side-modal-backdrop"
  [ngClass]="{ open: isOpen }"
  (click)="handleBackdropClick()"></div>

<div
  class="side-modal"
  [ngClass]="{
    open: isOpen,
    'side-modal--left': placement === 'left',
    'side-modal--with-close': showCloseButton,
    'side-modal--contain-scroll': containScroll,
    'side-modal--compact': size === 'compact',
  }"
  role="dialog"
  [attr.aria-modal]="isOpen"
  [attr.aria-hidden]="!isOpen"
  [attr.inert]="isOpen ? null : ''"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="isOpen"
  (click)="handleDialogClick($event)">
  @if (showCloseButton && isOpen) {
    <cs-close-button
      class="side-modal__close"
      size="sm"
      ariaLabel="Close dialog"
      (pressed)="handleHostClose()" />
  }
  <ng-content></ng-content>
</div>
