<div
  class="nav-overlay"
  (click)="closeMenu(true)"
  [attr.aria-hidden]="menuOpen ? null : 'true'"></div>

<nav
  #slideNav
  class="slide-nav"
  id="floatingNav"
  aria-label="Main navigation"
  [attr.aria-hidden]="menuOpen ? null : 'true'"
  [attr.inert]="menuOpen ? null : ''"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)">
  <div class="slide-nav__viewport">
    <ul class="slide-nav__links">
      <li *ngFor="let item of links; let i = index; trackBy: trackById">
        <a
          *ngIf="item.url"
          class="slide-nav__link"
          [class.active]="isActiveLink(item)"
          [routerLink]="path(item.url)"
          [style.transition-delay]="stagger(i)"
          (click)="closeMenu()">
          <span class="slide-nav__label">{{
            item.name | csTranslate: item.fallback
          }}</span>
        </a>

        <a
          *ngIf="item.href"
          class="slide-nav__link slide-nav__link--external"
          [href]="item.href"
          target="_blank"
          rel="noopener noreferrer"
          [style.transition-delay]="stagger(i)"
          (click)="closeMenu()">
          <span class="slide-nav__label">{{
            item.name | csTranslate: item.fallback
          }}</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="slide-nav__footer">
    <div class="slide-nav__languages" role="group" aria-label="Language">
      <button
        *ngFor="let locale of locales; let i = index; trackBy: trackById"
        type="button"
        class="slide-nav__locale"
        [class.active]="currentLocale() === locale"
        [style.transition-delay]="stagger(links.length + i)"
        (click)="selectLocale(locale)">
        {{ localeLabel(locale) }}
      </button>
    </div>

    <button
      type="button"
      class="slide-nav__logout"
      [style.transition-delay]="stagger(links.length + locales.length)"
      (click)="logout()">
      {{ 'Texts.sidebar-logout' | csTranslate: 'Logout' }}
    </button>
  </div>
</nav>
