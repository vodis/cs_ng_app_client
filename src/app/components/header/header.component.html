<header class="header" [ngClass]="{ mobile: isMobileView }">
  <div class="header__content">
    <a
      class="header__logo"
      [routerLink]="localizedRouting.path('/')"
      routerLinkActive="_active">
      <img
        alt="CraftScript Logo"
        height="40"
        loading="lazy"
        src="../../../assets/img/logo/logo.svg" />
    </a>
    <div class="header__content_connect">
      <button
        type="button"
        class="header__icon-button"
        aria-label="Notifications"
        title="Notifications">
        <mat-icon aria-hidden="true" fontSet="material-icons-outlined"
          >notifications</mat-icon
        >
      </button>
      <a
        class="header__account-link"
        [class.header__account-link--icon]="!!session || isMobileView"
        [routerLink]="localizedRouting.path(session ? '/portfolio' : '/login')"
        routerLinkActive="_active"
        [attr.aria-label]="
          session
            ? ('Texts.header-portfolio' | csTranslate: 'Portfolio')
            : ('Texts.header-sign-in' | csTranslate: 'Sign in')
        "
        [attr.title]="
          session
            ? ('Texts.header-portfolio' | csTranslate: 'Portfolio')
            : ('Texts.header-sign-in' | csTranslate: 'Sign in')
        ">
        @if (session || isMobileView) {
          <mat-icon
            aria-hidden="true"
            [fontSet]="
              isMobileView ? 'material-icons-outlined' : 'material-icons'
            "
            >person</mat-icon
          >
        } @else {
          {{ 'Texts.header-sign-in' | csTranslate: 'Sign in' }}
        }
      </a>
    </div>
  </div>
</header>
<app-animate-line
  *ngIf="horizontalLineAnimating"
  class="header__animate-line"
  (animationComplete)="onHorizontalLineAnimationComplete()" />
<div
  *ngIf="!horizontalLineAnimating"
  class="header__line"
  aria-hidden="true"></div>
