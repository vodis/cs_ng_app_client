<section class="profile-shell">
  <section class="profile-shell__panel profile-shell__panel--wide">
    <h2>Sessions</h2>

    <div class="profile-shell__sessions-wrap">
      <table class="profile-shell__sessions-table">
        <thead>
          <tr>
            <th>Status</th>
            <th>Issued</th>
            <th>End date</th>
            <th>Organization</th>
            <th>Authentication</th>
            <th>Application</th>
            <th class="profile-shell__sessions-chevron" aria-hidden="true"></th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="
              let login of visibleLoginSessions;
              trackBy: trackByLoginSession
            ">
            <td data-label="Status">
              <span
                class="profile-shell__session-status"
                [class.profile-shell__session-status--active]="
                  login.status === 'Active'
                "
                [class.profile-shell__session-status--revoked]="
                  login.status === 'Revoked'
                ">
                <span
                  class="profile-shell__session-dot"
                  aria-hidden="true"></span>
                {{ login.status }}
              </span>
            </td>
            <td data-label="Issued">{{ login.issued }}</td>
            <td data-label="End date">{{ login.endDate }}</td>
            <td data-label="Organization">{{ login.organization }}</td>
            <td data-label="Authentication">{{ login.authentication }}</td>
            <td data-label="Application" class="profile-shell__sessions-app">
              {{ login.application }}
            </td>
            <td class="profile-shell__sessions-chevron" aria-hidden="true">
              <svg viewBox="0 0 16 16" focusable="false">
                <path
                  d="M6 3.2 11 8 6 12.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5" />
              </svg>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <button
      type="button"
      mat-button
      color="primary"
      class="profile-shell__sessions-more"
      *ngIf="loginSessions.length > 2"
      (click)="toggleSessions()">
      {{ showAllSessions ? 'Show last 2' : 'See all past sessions' }}
    </button>
  </section>

  <p class="profile-shell__error" *ngIf="error">{{ error }}</p>

  <footer class="profile-shell__account-footer">
    <p class="profile-shell__account-footer-copy">Sign out of this device</p>
    <div class="profile-shell__account-footer-actions">
      <button
        type="button"
        mat-stroked-button
        [disabled]="loading$ | async"
        (click)="logout()">
        Logout
      </button>
      <button
        type="button"
        mat-stroked-button
        [disabled]="loading$ | async"
        (click)="requestDeletion()">
        Delete account
      </button>
    </div>
    <p class="profile-shell__message" *ngIf="deletionMessage">
      {{ deletionMessage }}
    </p>
  </footer>
</section>
