<section class="portfolio-sessions" aria-label="Sessions">
  <div class="portfolio-panel portfolio-sessions__panel">
    <div class="portfolio-panel__header">
      <div>
        <p class="portfolio-panel__eyebrow">Access</p>
        <h2>Sessions</h2>
      </div>
    </div>

    <div class="portfolio-sessions__wrap">
      <table class="portfolio-sessions__table">
        <thead>
          <tr>
            <th>Status</th>
            <th>Issued</th>
            <th>End date</th>
            <th>Organization</th>
            <th>Authentication</th>
            <th>Application</th>
            <th>
              <span class="visually-hidden">Actions</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="
              let login of visibleLoginSessions;
              trackBy: trackByLoginSession
            ">
            <td data-label="Status">
              <span
                class="portfolio-sessions__status"
                [class.portfolio-sessions__status--active]="
                  login.status === 'Active'
                "
                [class.portfolio-sessions__status--expired]="
                  login.status === 'Expired'
                "
                [class.portfolio-sessions__status--revoked]="
                  login.status === 'Revoked'
                ">
                <span class="portfolio-sessions__dot" aria-hidden="true"></span>
                {{ login.status }}
              </span>
              <span
                class="portfolio-sessions__device"
                *ngIf="login.currentDevice"
                >This device</span
              >
            </td>
            <td data-label="Issued">{{ login.issued }}</td>
            <td data-label="End date">{{ login.endDate }}</td>
            <td data-label="Organization">{{ login.organization }}</td>
            <td data-label="Authentication">{{ login.authentication }}</td>
            <td data-label="Application" class="portfolio-sessions__app">
              {{ login.application }}
            </td>
            <td data-label="Actions" class="portfolio-sessions__actions">
              <button
                type="button"
                class="portfolio-sessions__revoke"
                *ngIf="canRevoke(login)"
                (click)="confirmRevoke(login)">
                Revoke
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <button
      type="button"
      mat-button
      color="primary"
      class="portfolio-sessions__more"
      *ngIf="loginSessions.length > 2"
      (click)="toggleSessions()">
      {{ showAllSessions ? 'Show last 2' : 'See all past sessions' }}
    </button>
  </div>

  <p class="portfolio-sessions__error" *ngIf="error">{{ error }}</p>
</section>
